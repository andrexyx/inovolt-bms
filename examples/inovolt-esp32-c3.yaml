# InoVolt manual test profile for one or two Tianpower BLE batteries.
# Modified from the upstream multiple-device ESPHome example.
substitutions:
  name: inovolt-bms
  battery_1_name: "InoVolt Battery 1"
  battery_2_name: "InoVolt Battery 2"
  external_components_source: github://andrexyx/inovolt-bms@main

esphome:
  name: ${name}
  friendly_name: "InoVolt BMS"
  comment: "Monitor Tianpower BMS devices via BLE"
  project:
    name: "inovolt.bms"
    version: "0.1.0-dev"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  # Normal operation: connect to the customer's local Wi-Fi.
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Temporary fallback/onboarding network. It is not used for telemetry.
  ap:
    ssid: "inovolt"
    password: "12345678"

captive_portal:

logger:
  level: DEBUG

api:
  # Home Assistant communicates directly with the ESP on the local network.
  reboot_timeout: 0s

ota:
  - platform: esphome
    on_begin:
      then:
        - switch.turn_off: ble_client_switch0
        - switch.turn_off: ble_client_switch1

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bms0_mac_address
    id: client0
  - mac_address: !secret bms1_mac_address
    id: client1

tianpower_bms_ble:
  - ble_client_id: client0
    id: bms0
    update_interval: 10s
  - ble_client_id: client1
    id: bms1
    update_interval: 10s

switch:
  - platform: ble_client
    ble_client_id: client0
    id: ble_client_switch0
    name: "${battery_1_name} Bluetooth connection"
  - platform: ble_client
    ble_client_id: client1
    id: ble_client_switch1
    name: "${battery_2_name} Bluetooth connection"

# The complete entity list remains in esp32-ble-example-multiple-devices.yaml.
# The captive portal in this development profile configures Wi-Fi only; BLE battery
# selection is the next implementation milestone described in docs/ARCHITECTURE.md.
