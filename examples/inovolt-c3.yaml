substitutions:
  name: inovolt-bms

esphome:
  name: ${name}
  friendly_name: InoVolt BMS
  min_version: 2026.7.4
  project:
    name: inovolt.bms
    version: 0.1.0-dev

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source: ../components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: inovolt
    password: "12345678"

captive_portal:

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 60ms

inovolt_bms:
